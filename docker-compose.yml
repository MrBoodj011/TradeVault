services:
  tradevault:
    build:
      context: .
      dockerfile: Dockerfile
    image: tradevault:local
    container_name: tradevault
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
