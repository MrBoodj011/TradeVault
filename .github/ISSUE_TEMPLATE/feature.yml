name: Feature request
description: Propose a privacy-preserving TradeVault improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What trading or review workflow needs improvement?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and data impact
      description: Does this add storage, networking, credentials, or third-party services?
    validations:
      required: true
