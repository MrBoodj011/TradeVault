name: Bug report
description: Report a reproducible TradeVault problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove private trading data, screenshots, and passphrases before submitting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe set of steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and browser
    validations:
      required: true
